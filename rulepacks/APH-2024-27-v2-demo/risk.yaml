risk:
  weights: { CRITICAL: 40, MAJOR: 15, MINOR: 5, INFO: 0 }
  forensic_confidence_weighting: true   # forensic-only flags count weight x confidence
  tiers:
    RED: { label: "High risk", any_severity: CRITICAL, min_score: 60 }
    AMBER: { label: "Medium risk", any_severity: MAJOR, min_score: 20 }
    GREEN: { label: "No risk" }
  thresholds:
    photo_gps_radius_km: 1.0
    builtup_deviation: 0.15
    cross_year_change: 0.10
    name_similarity: 0.9
    expiry_alert_days: 60
    pending_alert_days: 7
